<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(60px, 30px) scale(1.18); opacity: 0.65; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      }
      @keyframes pulseOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.4; }
        50% { transform: translate(-50px, -25px) scale(0.9); opacity: 0.7; }
        100% { transform: translate(0px, 0px) scale(1.1); opacity: 0.4; }
      }
      @keyframes floatDataFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 5px; fill-opacity: 0.8; }
        50% { r: 8px; fill-opacity: 1; }
      }
      .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; }
      .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; }
      .flow-line {
        stroke-dasharray: 10, 15;
        animation: floatDataFlow 6s linear infinite;
      }
      .pulse-node { animation: nodeGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (Behind content) -->
  <g>
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#0284c7" filter="url(#glowCyan)" />
    <circle class="orb-2" cx="980" cy="300" r="170" fill="#7c3aed" filter="url(#glowPurple)" />
    <circle class="orb-1" cx="820" cy="90" r="90" fill="#0d9488" filter="url(#glowCyan)" />
  </g>

  <!-- Animated Background Network Graph / Data Flows (Safe in background) -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path class="flow-line" d="M 100 350 Q 300 280 500 360 T 900 320 T 1120 370" />
    <path class="flow-line" d="M 80 80 Q 350 40 600 90 T 1050 60" style="animation-duration: 9s;" />
    <line x1="160" y1="350" x2="260" y2="300" stroke="rgba(129, 140, 248, 0.25)" />
    <line x1="900" y1="320" x2="980" y2="240" stroke="rgba(129, 140, 248, 0.25)" />
  </g>

  <!-- Constellation Nodes -->
  <g fill="#38bdf8">
    <circle class="pulse-node" cx="160" cy="350" r="5" />
    <circle class="pulse-node" cx="350" cy="290" r="6" style="animation-delay: 1s;" />
    <circle class="pulse-node" cx="720" cy="340" r="5" style="animation-delay: 1.5s;" />
    <circle class="pulse-node" cx="900" cy="320" r="7" style="animation-delay: 2s;" />
    <circle class="pulse-node" cx="980" cy="240" r="5" style="animation-delay: 0.5s;" />
  </g>

  <!-- Foreground Content: Header Tag / Badge -->
  <g transform="translate(600, 75)">
    <rect x="-195" y="-17" width="390" height="34" rx="17" fill="url(#cyanPill)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="1.5">⚡ WEB3 &amp; DECENTRALIZED STORAGE ECOSYSTEM</text>
  </g>

  <!-- Primary Foreground Title -->
  <text x="600" y="165" text-anchor="middle" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome Decentralized Storage
  </text>
  <text x="600" y="215" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="700" letter-spacing="-0.2">
    &amp; Web3 Operating Systems
  </text>

  <!-- Subtitle -->
  <text x="600" y="265" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="400">
    Curated architectures for IPFS, Filecoin, Arweave, P2P data sync, and sovereign cryptographic clouds
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(600, 325)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-size="12" font-weight="500">📦 IPFS / IPLD</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-215, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-size="12" font-weight="500">📜 Filecoin Proofs</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(-55, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-size="12" font-weight="500">♾️ Arweave Permaweb</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(110, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-size="12" font-weight="500">☁️ S3 Distributed DePIN</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(280, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text text-anchor="middle" y="4" fill="#cbd5e1" font-size="12" font-weight="500">🖥️ Web3 Workspaces &amp; OS</text>
    </g>
  </g>
</svg>
