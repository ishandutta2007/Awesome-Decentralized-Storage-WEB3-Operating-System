<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a12"/><stop offset="50%" stop-color="#0b1329"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyanPill" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".25"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="22"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.35}50%{transform:translate(60px,30px) scale(1.18);opacity:.65}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1.1);opacity:.4}50%{transform:translate(-50px,-25px) scale(.9);opacity:.7}}@keyframes floatDataFlow{0%{stroke-dashoffset:240}}@keyframes nodeGlow{0%{r:5px;fill-opacity:.8}50%{r:8px;fill-opacity:1}}.orb-1{animation:pulseOrb1 9s ease-in-out infinite}.orb-2{animation:pulseOrb2 11s ease-in-out infinite}.flow-line{stroke-dasharray:10,15;animation:floatDataFlow 6s linear infinite}.pulse-node{animation:nodeGlow 3s ease-in-out infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><g><circle cx="220" cy="120" r="140" fill="#0284c7" class="orb-1" filter="url(#glowCyan)"/><circle cx="980" cy="300" r="170" fill="#7c3aed" class="orb-2" filter="url(#glowPurple)"/><circle cx="820" cy="90" r="90" fill="#0d9488" class="orb-1" filter="url(#glowCyan)"/></g><g fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.5"><path d="M 100 350 Q 300 280 500 360 T 900 320 T 1120 370" class="flow-line"/><path d="M 80 80 Q 350 40 600 90 T 1050 60" class="flow-line" style="animation-duration:9s"/><line x1="160" x2="260" y1="350" y2="300" stroke="rgba(129, 140, 248, 0.25)"/><line x1="900" x2="980" y1="320" y2="240" stroke="rgba(129, 140, 248, 0.25)"/></g><g fill="#38bdf8"><circle cx="160" cy="350" r="5" class="pulse-node"/><circle cx="350" cy="290" r="6" class="pulse-node" style="animation-delay:1s"/><circle cx="720" cy="340" r="5" class="pulse-node" style="animation-delay:1.5s"/><circle cx="900" cy="320" r="7" class="pulse-node" style="animation-delay:2s"/><circle cx="980" cy="240" r="5" class="pulse-node" style="animation-delay:.5s"/></g><g transform="translate(600, 75)"><rect width="390" height="34" x="-195" y="-17" fill="url(#cyanPill)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="17"/><text y="5" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">⚡ WEB3 &amp; DECENTRALIZED STORAGE ECOSYSTEM</text></g><text x="600" y="165" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome Decentralized Storage</text><text x="600" y="215" fill="#f8fafc" font-size="30" font-weight="700" letter-spacing="-.2" text-anchor="middle">&amp; Web3 Operating Systems</text><text x="600" y="265" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="middle">Curated architectures for IPFS, Filecoin, Arweave, P2P data sync, and sovereign cryptographic clouds</text><g><g transform="translate(600, 325) translate(-360, 0)"><rect width="120" height="28" x="-60" y="-14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="14"/><text y="4" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">📦 IPFS / IPLD</text></g><g transform="translate(600, 325) translate(-215, 0)"><rect width="140" height="28" x="-70" y="-14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="14"/><text y="4" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">📜 Filecoin Proofs</text></g><g transform="translate(600, 325) translate(-55, 0)"><rect width="150" height="28" x="-75" y="-14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="14"/><text y="4" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">♾️ Arweave Permaweb</text></g><g transform="translate(600, 325) translate(110, 0)"><rect width="150" height="28" x="-75" y="-14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="14"/><text y="4" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">☁️ S3 Distributed DePIN</text></g><g transform="translate(600, 325) translate(280, 0)"><rect width="160" height="28" x="-80" y="-14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="14"/><text y="4" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">🖥️ Web3 Workspaces &amp; OS</text></g></g></svg>